name: Daily Resource News Bot

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

# アーカイブ(docs/)をリポジトリにコミットして戻すため書き込み権限が必要
permissions:
  contents: write

# X投稿ジョブと同時に走ってpushが衝突しないよう直列化する
concurrency:
  group: daily-news-repo-write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なライブラリをインストール
        run: pip install google-genai requests requests-oauthlib markdown

      - name: プログラムを実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # X(旧Twitter)自動投稿。4つすべて設定されているときだけ投稿する
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_HASHTAGS: ${{ vars.X_HASHTAGS }}
          X_POST_SLOTS: ${{ vars.X_POST_SLOTS }}
          # 収益化用の任意設定(Secrets/Variables で設定すると反映)
          SPONSOR_MESSAGE: ${{ vars.SPONSOR_MESSAGE }}
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python daily_news.py

      - name: アーカイブと投稿キューをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "更新なし。コミットをスキップします。"
          else
            git commit -m "Publish archive $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
